name: build_deploy

on:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_CLASSIC }}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
#      - name: Set up QEMU
#        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_CLASSIC }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          secrets: |
            git_auth_token=${{ secrets.PAT_CLASSIC }}
          tags: |
            ghcr.io/ullav-dev/clann-server:${{ steps.commit.outputs.short }}
            ghcr.io/ullav-dev/clann-server:latest
