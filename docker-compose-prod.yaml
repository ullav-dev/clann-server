services:
  surrealdb:
    build:
      context: .
      dockerfile: scripts/Dockerfile.surrealdb
    networks:
      - ullav-net
    restart: unless-stopped
    volumes:
      - surrealdb_data:/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD", "surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: scripts/Dockerfile.migrate
    volumes:
      - ./migrations:/migrations:ro
    env_file:
      - .env.prod
    secrets:
      - db_username
      - db_password
    networks:
      - ullav-net
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/ullav-dev/clann-server:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.prod
    environment:
      - DB_USERNAME_FILE=/run/secrets/db_username
      - DB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_username
      - db_password
    networks:
      - ullav-net
    volumes:
      - uploads:/app/uploads
    depends_on:
      surrealdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  surrealdb_data:
  uploads:

networks:
  ullav-net:
    external: true

secrets:
  db_username:
    file: ./secrets/db_username.txt
  db_password:
    file: ./secrets/db_password.txt
